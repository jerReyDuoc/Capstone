name: Trigger auto deployment for web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/web-AutoDeployTrigger-97cdcf98-b9ca-44c9-9158-18cbd3100429.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/Proyecto/frontend-next
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrcomplainceia.azurecr.io
          registryUsername: ${{ secrets.WEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WEB_REGISTRY_PASSWORD }}
          containerAppName: web
          resourceGroup: rg-complainceia
          imageToBuild: acrcomplainceia.azurecr.io/web:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


