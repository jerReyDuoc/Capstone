# Sistema completo con un solo comando (desde la carpeta Proyecto/):
#
#     docker compose up -d --build
#
#   web       http://localhost:3000        (frontend Next.js: landing, encuesta y panel)
#   api       http://localhost:8000/docs   (FastAPI)
#   worker    procesa evidencias (capa de Políticas e IA: spaCy + Groq)
#   migrate   aplica "alembic upgrade head" y termina (con el dueño de la BD; ver HU-09 abajo)
#   db        PostgreSQL 16   -> localhost:5433 (para DBeaver/psql y las pruebas en vivo)
#   redis     cola de ARQ     -> localhost:6379
#
# Requisito: UN SOLO archivo de configuración, Proyecto/.env (junto a este archivo),
# copiado de .env.example y con GROQ_API_KEY, ENTITY_MAP_KEY y AUTH_SECRET. Compose lo usa
# dos veces: para los ${...} de este archivo (puertos, POSTGRES_*, secretos del web) y como
# env_file de api/worker/migrate. Las URLs de BD, Redis y STORAGE_DIR de ese .env se
# IGNORAN aquí: se reemplazan por los nombres de servicio de Docker ("environment" abajo).
#
# PUERTOS EN WINDOWS: Hyper-V/WSL reserva rangos de puertos al azar y entonces Docker
# falla con "bind: An attempt was made to access a socket in a way forbidden by its
# access permissions" (pasaba con el 8080). Cada puerto del host se puede cambiar sin
# editar este archivo, en el mismo Proyecto/.env, por ejemplo:
#
#     WEB_PORT=3001
#     API_PORT=8001
#
# Para ver los rangos reservados en tu PC (PowerShell):
#     netsh interface ipv4 show excludedportrange protocol=tcp

# HU-09: dos usuarios de PostgreSQL.
#   - migrate se conecta con el DUEÑO de las tablas (POSTGRES_USER): crea y altera tablas y
#     crea el rol de la aplicación.
#   - api y worker se conectan con DB_APP_USER (complianceia_app): un rol SIN superusuario
#     que en audit_log solo puede leer e insertar (sin UPDATE, DELETE ni TRUNCATE). Su clave
#     es DB_APP_PASSWORD (en producción, una propia de 16+ caracteres).
x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379
  STORAGE_DIR: /data/storage
  # HU-19: mismo secreto que el servicio web. Vacío = la API no exige el BFF.
  BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-}

# Conexión del rol limitado (api y worker)
x-backend-env-app: &backend-env-app
  <<: *backend-env
  DATABASE_URL: postgresql+asyncpg://${DB_APP_USER:-complianceia_app}:${DB_APP_PASSWORD:-complianceia_app_dev}@db:5432/${POSTGRES_DB:-complaince_db}
  DATABASE_URL_SYNC: postgresql+psycopg2://${DB_APP_USER:-complianceia_app}:${DB_APP_PASSWORD:-complianceia_app_dev}@db:5432/${POSTGRES_DB:-complaince_db}
  # Los contenedores de la app no necesitan la clave del dueño (viene en el .env único)
  POSTGRES_PASSWORD: ""

x-backend: &backend
  build: ./backend
  image: complianceai-backend:latest
  env_file:
    - ./.env
  environment:
    <<: *backend-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-complaince_db}
    DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-complaince_db}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-complaince_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-complaince_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend          # con el dueño de las tablas (HU-09)
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    environment: *backend-env-app   # HU-09: rol limitado
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    <<: *backend
    environment: *backend-env-app   # HU-09: rol limitado
    command: ["arq", "app.worker.tasks.WorkerSettings"]
    restart: unless-stopped
    volumes:
      - storage:/data/storage   # el mismo volumen que la API: aquí lee las evidencias
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Frontend en Next.js (landing HU-19, cuestionario y panel). Carpeta Proyecto/frontend-next/.
  # El prototipo HTML (antiguo servicio "frontend" en :8088) quedó en Extras/frontend-prototipo/.
  # Next reenvía /api/* al servicio "api" por la red interna de Docker.
  web:
    build:
      context: ./frontend-next
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_DEMO: "0"
    image: complianceai-web:latest
    restart: unless-stopped
    environment:
      # HU-19 (se leen al ejecutar, no al construir). Ver frontend-next/README.md
      API_URL: http://api:8000
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:-}
      # Clave pública de Turnstile; vacía = clave de prueba de Cloudflare (siempre aprueba)
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      # Proxies de confianza delante del contenedor web (0 = acceso directo, como en local)
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # HU-07 (opcional): modelo LOCAL con Ollama. No se levanta con "docker compose up": se activa con
  #     docker compose --profile modelo-local up -d
  #     docker compose exec ollama ollama pull qwen2.5:7b-instruct
  # y en Proyecto/.env: LLM_PROVIDER=ollama, LLM_MODEL=qwen2.5:7b-instruct (OLLAMA_URL ya apunta aquí).
  # Sin puerto publicado: solo lo usan la API y el worker por la red interna.
  ollama:
    image: ollama/ollama:latest
    profiles: ["modelo-local"]
    restart: unless-stopped
    volumes:
      - ollama_modelos:/root/.ollama

volumes:
  postgres_data:   # mismo nombre que antes: se conservan los datos que ya tienes
  storage:
  ollama_modelos:  # HU-07: modelos descargados por Ollama (perfil modelo-local)