<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe de madurez — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container-lg" id="app">
    <p class="loading">Cargando informe…</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/pdf-informe.js"></script>
<script>
(function () {
  var meActual = null;
  var informeActual = null;

  Therion.ui.protegerPagina({ permitidoSinDiagnostico: true }).then(function (me) {
    meActual = me;
    return Therion.store.api.ultimoDiagnosticoCerrado();
  }).then(function (diag) {
    return Therion.store.api.informe(diag.id);
  }).then(function (informe) {
    informeActual = informe;
    render(informe);
  }).catch(function () {
    document.getElementById("app").innerHTML =
      '<p class="error-text" style="text-align:center;padding-top:48px;">Todavía no tienes un diagnóstico cerrado para mostrar.</p>';
  });

  function render(informe) {
    var colorGeneral = Therion.ui.COLOR_RIESGO[informe.riesgo_general] || "var(--na)";
    var app = document.getElementById("app");

    var dimensionesHtml = informe.por_dimension.map(function (d) {
      var color = Therion.ui.COLOR_DIMENSION[d.clasificacion] || "var(--na)";
      return (
        '<div class="card flex items-center gap-4">' +
        Therion.ui.ring(d.puntaje, color, { size: 84, thickness: 9, centerLabel: d.puntaje !== null ? d.puntaje + "%" : "—" }) +
        '<div><p class="text-sm text-muted mb-1">' + Therion.ui.escapeHtml(d.dimension) + '</p>' +
        Therion.ui.statusTag(d.clasificacion, color) +
        '<p class="text-xs text-faint mt-1">' + d.n_evaluados + ' controles evaluados</p></div></div>'
      );
    }).join("");

    var brechasHtml = informe.brechas.length === 0
      ? '<p class="text-sm text-muted">No hay brechas: todos los controles evaluados están cumplidos.</p>'
      : informe.brechas.map(function (b) {
        var colorCrit = Therion.ui.COLOR_CRITICIDAD[b.criticidad] || "var(--na)";
        return (
          '<div class="card mb-4">' +
          '<div class="flex justify-between items-center mb-2">' +
          '<h3 class="font-editorial" style="font-size:1.05rem;">' + Therion.ui.escapeHtml(b.brecha_asociada) + '</h3>' +
          Therion.ui.statusTag(b.criticidad, colorCrit) +
          '</div>' +
          campo("Fuente", b.fuente) +
          campo("Dimensión", b.dominio) +
          campo("Evidencia entregada", b.evidencia_entregada || "No se entregó evidencia.") +
          campo("Evidencia esperada", b.evidencia_esperada) +
          campo("Recomendación", b.recomendacion) +
          campo("Ruta formativa vinculada", b.ruta_formativa) +
          '</div>'
        );
      }).join("");

    app.innerHTML =
      '<div class="flex justify-between items-start mb-1" style="gap:16px;">' +
      '<div><h1 class="font-editorial" style="font-size:1.6rem;">Informe de madurez</h1>' +
      '<p class="text-xs text-faint font-technical">Diagnóstico ' + Therion.ui.escapeHtml(informe.diagnostico_id) + '</p></div>' +
      '<button class="btn" id="btn-pdf">Descargar PDF</button>' +
      '</div>' +

      '<div class="card flex items-center gap-4" style="margin:32px 0;">' +
      Therion.ui.ring(informe.puntaje_general, colorGeneral, { centerLabel: informe.puntaje_general !== null ? informe.puntaje_general + "%" : "—", centerSubLabel: "madurez" }) +
      '<div><p class="text-sm text-muted mb-1">Nivel de riesgo general</p>' +
      '<p class="font-editorial mb-2" style="font-size:1.5rem;font-weight:600;color:' + colorGeneral + '">' + Therion.ui.escapeHtml(informe.riesgo_general) + '</p>' +
      '<p class="text-sm text-muted">' + informe.n_evaluados + ' / ' + informe.n_aplicables + ' controles evaluados</p></div>' +
      '</div>' +

      '<h2 class="font-editorial mb-3" style="font-size:1.15rem;">Puntaje por dimensión</h2>' +
      '<div class="card-grid mb-8">' + dimensionesHtml + '</div>' +

      '<h2 class="font-editorial mb-3" style="font-size:1.15rem;">Brechas priorizadas (' + informe.brechas.length + ')</h2>' +
      brechasHtml;

    document.getElementById("btn-pdf").addEventListener("click", function () {
      Therion.pdf.generarInformePdf(informeActual, meActual ? meActual.nombre : undefined);
    });
  }

  function campo(etiqueta, valor) {
    return (
      '<div class="mb-2">' +
      '<p class="text-xs text-faint" style="text-transform:uppercase;letter-spacing:.02em;">' + Therion.ui.escapeHtml(etiqueta) + '</p>' +
      '<p class="text-sm mt-1">' + Therion.ui.escapeHtml(valor) + "</p></div>"
    );
  }
})();
</script>
</body>
</html>
