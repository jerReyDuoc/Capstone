<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo formativo — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container" id="app">
    <p class="loading">Cargando módulo…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var dimension = params.get("dimension") || "";
  var nivel = params.get("nivel") || "";
  var moduloActual = null;

  Therion.ui.protegerPagina({ permitidoSinDiagnostico: false }).then(function () {
    return Therion.store.api.obtenerModulo(dimension, nivel);
  }).then(function (modulo) {
    moduloActual = modulo;
    render("bloqueado");
    // Lee el estado actual real desde el mapa formativo para mostrar el botón correcto
    return Therion.store.api.mapaFormativo();
  }).then(function (mapa) {
    var lista = mapa[dimension] || [];
    var actual = lista.filter(function (m) { return m.id === moduloActual.id; })[0];
    render(actual ? actual.estado : "bloqueado");
  }).catch(function () {
    document.getElementById("app").innerHTML = '<p class="error-text" style="text-align:center;padding-top:48px;">Módulo no encontrado.</p>';
  });

  function render(estadoProgreso) {
    var app = document.getElementById("app");
    var labelBoton = estadoProgreso === "completado" ? "Módulo completado ✓" : "Marcar avance";
    app.innerHTML =
      '<a href="formacion-mapa.html" class="text-xs mb-4" style="color:var(--accent);display:inline-block;">&larr; Volver al mapa</a>' +
      '<p class="text-xs text-faint mb-1">' + Therion.ui.escapeHtml(moduloActual.dimension) + ' &middot; Nivel ' + Therion.ui.escapeHtml(moduloActual.nivel) + '</p>' +
      '<h1 class="font-editorial mb-4" style="font-size:1.6rem;">' + Therion.ui.escapeHtml(moduloActual.titulo) + '</h1>' +
      '<div class="card mb-6"><p class="text-sm">' + Therion.ui.escapeHtml(moduloActual.contenido) + '</p></div>' +
      '<p class="text-xs text-faint mb-8">Este módulo cubre ' + moduloActual.controles.length + ' control(es) de la matriz relacionados con esta dimensión y nivel.</p>' +
      '<button class="btn" id="btn-avanzar"' + (estadoProgreso === "completado" ? " disabled" : "") + '>' + labelBoton + '</button>';

    var btn = document.getElementById("btn-avanzar");
    if (btn && estadoProgreso !== "completado") {
      btn.addEventListener("click", function () {
        Therion.store.api.actualizarProgreso(moduloActual.id).then(function (res) {
          render(res.estado);
        });
      });
    }
  }
})();
</script>
</body>
</html>
