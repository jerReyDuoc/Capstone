<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico cerrado — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container" style="text-align:center;" id="app">
    <p class="loading">Cargando resumen…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
  Therion.ui.protegerPagina({ permitidoSinDiagnostico: true }).then(function () {
    return Therion.store.api.ultimoDiagnosticoCerrado();
  }).then(function (diag) {
    return Therion.store.api.informe(diag.id);
  }).then(function (informe) {
    var color = Therion.ui.COLOR_RIESGO[informe.riesgo_general] || "var(--na)";
    var app = document.getElementById("app");
    app.innerHTML =
      '<h1 class="font-editorial mb-4" style="font-size:1.6rem;">Diagnóstico cerrado</h1>' +
      '<p class="text-muted mb-2">Evaluaste ' + informe.n_evaluados + ' de ' + informe.n_aplicables + ' controles aplicables.</p>' +
      '<p class="font-editorial" style="font-size:3rem; font-weight:600; margin:24px 0;">' +
      (informe.puntaje_general !== null ? informe.puntaje_general + "%" : "—") + '</p>' +
      '<p class="mb-8" style="font-weight:600; color:' + color + '">' + Therion.ui.escapeHtml(informe.riesgo_general) + '</p>' +
      '<a href="informe.html" class="btn">Ver informe completo</a>';
  }).catch(function () {
    window.location.href = "diagnostico.html";
  });
</script>
</body>
</html>
