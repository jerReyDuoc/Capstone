<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container" id="app">
    <p class="loading">Cargando…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
  Therion.ui.protegerPagina({ permitidoSinDiagnostico: false }).then(function (me) {
    var app = document.getElementById("app");
    function fila(label, value) {
      return '<div class="list-row"><span class="text-muted">' + Therion.ui.escapeHtml(label) +
        '</span><span class="font-technical">' + Therion.ui.escapeHtml(value) + "</span></div>";
    }
    app.innerHTML =
      '<h1 class="font-editorial mb-6" style="font-size:1.6rem;">Perfil</h1>' +
      '<div class="card">' +
      fila("Nombre", me.nombre) +
      fila("Correo", me.email) +
      fila("Rol", me.rol) +
      fila("Organización", me.organizacion_id || "—") +
      fila("Diagnóstico completado", me.tiene_diagnostico_cerrado ? "Sí" : "No") +
      "</div>";
  }).catch(function () {});
</script>
</body>
</html>
