<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo formativo — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container" id="app">
    <p class="loading">Cargando módulo…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var dimension = params.get("dimension") || "";
  var nivel = params.get("nivel") || "";
  var moduloActual = null;
  var estadoProgreso = "bloqueado";

  Therion.ui.protegerPagina({ permitidoSinDiagnostico: false })
    .then(function () {
      return Promise.all([
        Therion.store.api.obtenerModulo(dimension, nivel),
        Therion.store.api.mapaFormativo(),
      ]);
    })
    .then(function (out) {
      moduloActual = out[0];
      var lista = out[1][dimension] || [];
      var actual = lista.filter(function (m) { return m.id === moduloActual.id; })[0];
      estadoProgreso = actual ? actual.estado : "bloqueado";
      render();
    })
    .catch(function () {
      document.getElementById("app").innerHTML =
        Therion.ui.emptyState({
          title: "Módulo no encontrado",
          description: "El módulo solicitado no existe.",
          actionHtml: '<a class="btn" href="formacion-mapa.html">Volver al mapa</a>',
        });
    });

  function render() {
    var app = document.getElementById("app");
    var completado = estadoProgreso === "completado";
    var labelBoton = completado ? "Módulo completado" : "Marcar avance";

    var controles = (moduloActual.controles || []).map(function (cid) {
      return Therion.ui.controlBadge(cid);
    }).join(" ");

    app.innerHTML =
      Therion.ui.breadcrumb([
        { label: "Formación", href: "formacion-mapa.html" },
        { label: moduloActual.titulo },
      ]) +
      Therion.ui.pageHeader({
        eyebrow: moduloActual.dimension + " · Nivel " + moduloActual.nivel,
        title: moduloActual.titulo,
        actions: completado
          ? ''
          : '<button class="btn" id="btn-avanzar">' + labelBoton + '</button>',
      }) +

      '<div class="card mb-4">' +
        '<p class="text-sm">' + Therion.ui.escapeHtml(moduloActual.contenido) + '</p>' +
      '</div>' +

      '<div class="card mb-6">' +
        '<p class="text-caption u-upper mb-2">Controles cubiertos por este módulo (' + (moduloActual.controles || []).length + ')</p>' +
        '<div class="flex gap-2 wrap">' + (controles || '<span class="text-faint">—</span>') + '</div>' +
      '</div>';

    var btn = document.getElementById("btn-avanzar");
    if (btn) {
      btn.addEventListener("click", function () {
        btn.disabled = true;
        btn.textContent = "Guardando…";
        Therion.store.api.actualizarProgreso(moduloActual.id).then(function (res) {
          estadoProgreso = res.estado;
          render();
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = labelBoton;
        });
      });
    }
  }
})();
</script>
</body>
</html>
