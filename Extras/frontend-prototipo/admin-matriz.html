<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backoffice: matriz — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container-lg" id="app">
    <p class="loading">Cargando…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var controles = [];
  var seleccionadoId = null;
  var filtroTexto = "";
  var filtroDominio = "";

  function cargar() {
    return Therion.store.api.listarControles().then(function (lista) {
      controles = lista;
      renderLista();
      if (seleccionadoId) {
        var sigue = controles.filter(function (c) { return c.control_id === seleccionadoId; })[0];
        if (sigue) renderEdicion();
      }
    });
  }

  function dominiosDisponibles() {
    var set = {};
    controles.forEach(function (c) { set[c.dominio] = true; });
    return Object.keys(set).sort();
  }

  function controlesFiltrados() {
    var t = filtroTexto.toLowerCase();
    return controles.filter(function (c) {
      var okDom = !filtroDominio || c.dominio === filtroDominio;
      var okTxt = !t ||
        c.control_id.toLowerCase().indexOf(t) !== -1 ||
        (c.pregunta || "").toLowerCase().indexOf(t) !== -1;
      return okDom && okTxt;
    });
  }

  function renderLista() {
    var app = document.getElementById("app");
    var visibles = controlesFiltrados();

    var opcionesDominio = ['<option value="">Todos los dominios</option>']
      .concat(dominiosDisponibles().map(function (d) {
        return '<option value="' + Therion.ui.escapeHtml(d) + '"' +
               (d === filtroDominio ? " selected" : "") + '>' + Therion.ui.escapeHtml(d) + '</option>';
      })).join("");

    var filas = visibles.length === 0
      ? '<div class="p-4 text-sm text-muted" style="padding:16px;">Sin resultados para el filtro actual.</div>'
      : visibles.map(function (c) {
          var criticidad = Therion.ui.COLOR_CRITICIDAD[c.criticidad] || "var(--na)";
          var selected = c.control_id === seleccionadoId ? ' aria-selected="true"' : '';
          return (
            '<button type="button" class="list-item" data-id="' + c.control_id + '" role="option"' + selected + '>' +
              '<div class="flex items-center gap-2 mb-1 wrap">' +
                Therion.ui.controlBadge(c.control_id) +
                '<span class="text-xs text-faint font-technical">v' + c.version + '</span>' +
                Therion.ui.statusTag(c.criticidad, criticidad) +
              '</div>' +
              '<p class="text-sm">' + Therion.ui.escapeHtml(c.pregunta) + '</p>' +
            '</button>'
          );
        }).join("");

    app.innerHTML =
      Therion.ui.pageHeader({
        eyebrow: "Administración",
        title: "Matriz de controles",
        subtitle: "Editar un control crea una nueva versión (append-only). Nunca se sobrescribe la anterior.",
      }) +

      '<div class="card-grid" style="grid-template-columns: 1fr 1fr; align-items:start;">' +

        '<div class="card card--flush">' +
          '<div style="padding:16px;border-bottom:1px solid var(--line);">' +
            '<label for="filtro-texto" class="text-xs text-muted mb-2">Buscar</label>' +
            '<input type="text" id="filtro-texto" placeholder="ID o texto de la pregunta…" value="' +
              Therion.ui.escapeHtml(filtroTexto) + '" autocomplete="off">' +
            '<div class="mt-3">' +
              '<label for="filtro-dominio" class="text-xs text-muted mb-2">Dominio</label>' +
              '<select id="filtro-dominio">' + opcionesDominio + '</select>' +
            '</div>' +
            '<p class="text-xs text-faint mt-3">' + visibles.length + ' de ' + controles.length + ' controles</p>' +
          '</div>' +
          '<div style="max-height:60vh;overflow-y:auto;" role="listbox" aria-label="Lista de controles">' + filas + '</div>' +
        '</div>' +

        '<div class="card" id="panel-edicion">' +
          '<p class="text-sm text-muted">Selecciona un control para editar su recomendación.</p>' +
        '</div>' +

      '</div>';

    // Filtros
    document.getElementById("filtro-texto").addEventListener("input", function (e) {
      filtroTexto = e.target.value;
      renderLista();
    });
    document.getElementById("filtro-dominio").addEventListener("change", function (e) {
      filtroDominio = e.target.value;
      renderLista();
    });

    // Selección
    document.querySelectorAll(".list-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        seleccionadoId = btn.getAttribute("data-id");
        document.querySelectorAll(".list-item").forEach(function (b) {
          b.setAttribute("aria-selected", b === btn ? "true" : "false");
        });
        renderEdicion();
      });
    });
  }

  function renderEdicion() {
    var control = controles.filter(function (c) { return c.control_id === seleccionadoId; })[0];
    if (!control) return;
    var panel = document.getElementById("panel-edicion");
    panel.innerHTML =
      '<div class="flex items-center gap-2 mb-3 wrap">' +
        Therion.ui.controlBadge(control.control_id) +
        '<span class="text-xs text-faint font-technical">versión vigente: v' + control.version + '</span>' +
      '</div>' +
      '<p class="text-sm mb-3">' + Therion.ui.escapeHtml(control.pregunta) + '</p>' +
      '<label for="input-recomendacion">Recomendación</label>' +
      '<textarea id="input-recomendacion" rows="6" ' +
        'placeholder="Describe la acción recomendada para cerrar la brecha.">' +
        Therion.ui.escapeHtml(control.recomendacion) +
      '</textarea>' +
      '<p class="field-help">Al guardar, se creará la versión v' + (control.version + 1) +
        ' y la versión actual quedará cerrada (nunca se sobrescribe).</p>' +
      '<p id="mensaje" class="hidden mt-3"></p>' +
      '<button class="btn mt-4" id="btn-guardar">Guardar como nueva versión</button>';

    document.getElementById("btn-guardar").addEventListener("click", function () {
      var btn = this;
      Therion.ui.mostrarModal(
        "Confirmar nueva versión",
        '<p class="text-sm mb-4">Se creará la versión v' + (control.version + 1) +
        ' del control <strong>' + Therion.ui.escapeHtml(control.control_id) + '</strong>. ' +
        'La versión actual quedará cerrada y no podrá editarse.</p>' +
        '<div class="flex gap-2 justify-between wrap">' +
          '<button type="button" class="btn btn--secondary" onclick="Therion.ui.cerrarModal()">Cancelar</button>' +
          '<button type="button" class="btn" id="btn-confirmar">Confirmar y guardar</button>' +
        '</div>'
      );

      document.getElementById("btn-confirmar").addEventListener("click", function () {
        Therion.ui.cerrarModal();
        btn.disabled = true;
        btn.textContent = "Guardando…";
        Therion.ui.mostrarExito("mensaje", "");
        var recomendacion = document.getElementById("input-recomendacion").value;
        Therion.store.api.actualizarControl(control.control_id, { recomendacion: recomendacion })
          .then(function (actualizado) {
            Therion.ui.mostrarExito("mensaje",
              "Se creó la versión v" + actualizado.version +
              ". La versión anterior quedó cerrada y no se sobrescribió.");
            btn.disabled = false;
            btn.textContent = "Guardar como nueva versión";
            return cargar();
          })
          .catch(function (err) {
            Therion.ui.mostrarError("mensaje", err.message || "Error al guardar");
            btn.disabled = false;
            btn.textContent = "Guardar como nueva versión";
          });
      });
    });
  }

  Therion.ui.protegerPagina({ permitidoSinDiagnostico: false, rolesPermitidos: ["admin_therion"] })
    .then(function () { return cargar(); })
    .catch(function () {});
})();
</script>
</body>
</html>
