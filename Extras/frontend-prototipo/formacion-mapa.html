<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa formativo — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container-lg" id="app">
    <p class="loading">Cargando mapa formativo…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
  var ESTADO_COLOR = { bloqueado: "var(--na)", en_curso: "var(--partial)", completado: "var(--verify)" };
  var ESTADO_LABEL = { bloqueado: "Bloqueado", en_curso: "En curso", completado: "Completado" };

  Therion.ui.protegerPagina({ permitidoSinDiagnostico: false })
    .then(function () { return Therion.store.api.mapaFormativo(); })
    .then(function (mapa) {
      var app = document.getElementById("app");
      var dimensiones = Object.keys(mapa);

      var secciones = dimensiones.map(function (dimension) {
        var modulos = mapa[dimension];
        var tarjetas = modulos.map(function (m) {
          return (
            '<a href="formacion-modulo.html?dimension=' + encodeURIComponent(dimension) +
              '&nivel=' + encodeURIComponent(m.nivel) + '" class="card card--action">' +
              '<p class="text-caption u-upper mb-2">' + Therion.ui.escapeHtml(m.nivel) + '</p>' +
              '<p class="text-sm mb-3" style="font-weight:500;">' + Therion.ui.escapeHtml(m.titulo) + '</p>' +
              Therion.ui.statusTag(ESTADO_LABEL[m.estado] || m.estado, ESTADO_COLOR[m.estado] || "var(--na)") +
            '</a>'
          );
        }).join("");

        return (
          '<section class="mb-8">' +
            '<h2 class="text-h2 mb-3">' + Therion.ui.escapeHtml(dimension) + '</h2>' +
            '<div class="card-grid card-grid--auto">' + tarjetas + '</div>' +
          '</section>'
        );
      }).join("");

      app.innerHTML =
        Therion.ui.pageHeader({
          title: "Mapa formativo",
          subtitle: "Módulos organizados por dimensión y nivel. Cada módulo cubre los controles relacionados con tus brechas.",
          actions: '<a class="btn btn--secondary" href="formacion-progreso.html">Ver mi progreso</a>',
        }) +
        (dimensiones.length === 0
          ? Therion.ui.emptyState({ title: "Sin módulos disponibles", description: "Aún no hay módulos formativos." })
          : secciones);
    })
    .catch(function () {});
</script>
</body>
</html>
