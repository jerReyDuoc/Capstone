<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container" id="app">
    <p class="loading">Cargando…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var ESTADOS = [
    { value: "cumplido", label: "Cumplido" },
    { value: "parcial",  label: "Parcial" },
    { value: "no",       label: "No cumplido" },
    { value: "revision", label: "Requiere revisión" },
    { value: "na",       label: "No aplica" },
  ];
  var EXIGEN_EVIDENCIA = { cumplido: true, parcial: true };

  var app = document.getElementById("app");
  var diagnosticoId = null;
  var reglas = [];
  var gateIndex = 0;
  var controles = [];
  var controlIndex = 0;
  var aplicablesTotales = [];
  var estadoSeleccionado = "cumplido";
  var archivoSeleccionado = null;

  function asegurarDiagnostico() {
    var id = window.localStorage.getItem("therion_diagnostico_id");
    if (id) return Promise.resolve(id);
    return Therion.store.api.crearDiagnostico().then(function (diag) {
      window.localStorage.setItem("therion_diagnostico_id", diag.id);
      return diag.id;
    });
  }

  function renderCerradoPorRaizNo() {
    app.innerHTML =
      '<div style="max-width:520px;margin:0 auto;text-align:center;padding-top:48px;">' +
        '<h1 class="text-h1 mb-3">Diagnóstico cerrado</h1>' +
        '<p class="text-muted mb-6">Como tu organización no utiliza, desarrolla ni integra sistemas de IA, ' +
        'ningún control de la matriz aplica todavía. El diagnóstico quedó cerrado con 0 controles aplicables.</p>' +
        '<a class="btn" href="dashboard.html">Ir al panel</a>' +
      '</div>';
  }

  function renderGate() {
    var regla = reglas[gateIndex];
    app.innerHTML =
      '<div style="max-width:560px;margin:0 auto;padding-top:32px;">' +
        '<p class="text-caption u-upper font-technical mb-2">Puerta ' + (gateIndex + 1) + ' de ' + reglas.length + '</p>' +
        '<div class="progress mb-6"><span style="width:' + Math.round((gateIndex / reglas.length) * 100) + '%"></span></div>' +
        '<h1 class="text-h1 mb-6">' + Therion.ui.escapeHtml(regla.pregunta) + '</h1>' +
        '<p id="error" class="hidden mb-4"></p>' +
        '<div class="flex gap-3 wrap">' +
          '<button class="btn" style="flex:1;min-width:140px;" id="btn-si">Sí</button>' +
          '<button class="btn btn--secondary" style="flex:1;min-width:140px;" id="btn-no">No</button>' +
        '</div>' +
      '</div>';

    document.getElementById("btn-si").addEventListener("click", function () { responder(true); });
    document.getElementById("btn-no").addEventListener("click", function () { responder(false); });
  }

  function responder(respuesta) {
    var regla = reglas[gateIndex];
    Therion.store.api.responderGate(diagnosticoId, regla.orden, respuesta).then(function (resultado) {
      if (resultado.cerrado_por_raiz_no) { renderCerradoPorRaizNo(); return; }
      if (gateIndex + 1 < reglas.length) { gateIndex++; renderGate(); }
      else { pasarAEvaluacion(); }
    }).catch(function (err) {
      Therion.ui.mostrarError("error", err.message || "Error al responder");
    });
  }

  function pasarAEvaluacion() {
    Therion.store.api.controlesAplicables(diagnosticoId).then(function (res) {
      aplicablesTotales = res.aplicables;
      return Promise.all(res.aplicables.map(function (cid) { return Therion.store.api.obtenerControl(cid); }));
    }).then(function (detalles) {
      detalles.sort(function (a, b) { return a.control_id.localeCompare(b.control_id); });
      controles = detalles;
      controlIndex = 0;
      renderControl();
    });
  }

  function abrirInfoNormativa(control) {
    var fuente = control.framework_fuente + (control.articulo_referencia ? " — " + control.articulo_referencia : "");
    var html =
      '<div class="text-sm">' +
        Therion.ui.campo("Marco / fuente", fuente) +
        Therion.ui.campo("Tipo de fuente", control.tipo_fuente) +
        Therion.ui.campo("Obligación", control.obligacion) +
      '</div>';
    Therion.ui.mostrarModal("Base normativa de esta pregunta", html);
  }

  function renderControl() {
    var control = controles[controlIndex];
    estadoSeleccionado = "cumplido";
    archivoSeleccionado = null;

    var chips = ESTADOS.map(function (e) {
      return (
        '<button type="button" class="option-chip" role="radio" aria-checked="' +
        (e.value === estadoSeleccionado) + '" data-estado="' + e.value + '">' +
          '<span class="dot" aria-hidden="true"></span>' + e.label +
        '</button>'
      );
    }).join("");

    var progreso = Math.round((controlIndex / controles.length) * 100);

    app.innerHTML =
      '<div style="max-width:680px;margin:0 auto;">' +
        '<p class="text-caption u-upper font-technical mb-2">' +
          'Control ' + (controlIndex + 1) + ' de ' + controles.length +
          ' · ' + aplicablesTotales.length + ' aplicables' +
        '</p>' +
        '<div class="progress mb-6"><span style="width:' + progreso + '%"></span></div>' +

        '<div class="card mb-4">' +
          '<div class="flex justify-between items-start gap-3 mb-3 wrap">' +
            '<div class="flex items-center gap-2 wrap">' +
              Therion.ui.controlBadge(control.control_id) +
              '<span class="text-xs text-faint">' + Therion.ui.escapeHtml(control.dominio) + ' · Criticidad ' + Therion.ui.escapeHtml(control.criticidad) + '</span>' +
            '</div>' +
            '<button type="button" id="btn-info" class="btn btn--ghost btn--sm" aria-label="Ver base normativa">' +
              'ⓘ Base normativa' +
            '</button>' +
          '</div>' +
          '<h2 class="text-h2 mb-3">' + Therion.ui.escapeHtml(control.pregunta) + '</h2>' +
          Therion.ui.campo("Obligación", control.obligacion) +
          Therion.ui.campo("Evidencia esperada", control.evidencia_esperada) +
        '</div>' +

        '<div class="card">' +
          '<fieldset style="border:none;padding:0;margin:0;">' +
            '<legend class="text-sm text-muted mb-3">Selecciona el estado de cumplimiento</legend>' +
            '<div class="option-group mb-4" id="botones-estado" role="radiogroup" aria-label="Estado de cumplimiento">' +
              chips +
            '</div>' +
          '</fieldset>' +

          '<div class="mb-4">' +
            '<label for="input-archivo">Evidencia en PDF ' +
              '<span id="evidencia-obligatoria" class="req">(obligatoria)</span>' +
              '<span id="evidencia-opcional" class="opt hidden">(opcional)</span>' +
            '</label>' +
            '<label class="file-input" for="input-archivo">' +
              '<span class="file-btn">Seleccionar archivo</span>' +
              '<span class="file-name" id="archivo-nombre">Ningún archivo seleccionado</span>' +
              '<input type="file" accept="application/pdf" id="input-archivo">' +
            '</label>' +
            '<p id="evidencia-hint" class="field-help">Formato aceptado: PDF.</p>' +
          '</div>' +

          '<p id="error" class="hidden mb-3"></p>' +
          '<button class="btn btn--block" id="btn-guardar">' +
            (controlIndex + 1 < controles.length ? "Guardar y continuar" : "Guardar y cerrar diagnóstico") +
          '</button>' +
        '</div>' +
      '</div>';

    document.getElementById("btn-info").addEventListener("click", function () { abrirInfoNormativa(control); });

    document.querySelectorAll('#botones-estado button').forEach(function (btn) {
      btn.addEventListener("click", function () {
        estadoSeleccionado = btn.getAttribute("data-estado");
        document.querySelectorAll("#botones-estado button").forEach(function (b) {
          b.setAttribute("aria-checked", b === btn ? "true" : "false");
        });
        actualizarRequisitoEvidencia();
        Therion.ui.mostrarError("error", "");
      });
    });

    document.getElementById("input-archivo").addEventListener("change", function (e) {
      var file = e.target.files[0] || null;
      var nombre = document.getElementById("archivo-nombre");
      if (file && file.type !== "application/pdf") {
        Therion.ui.mostrarError("error", "La evidencia debe subirse en formato PDF.");
        archivoSeleccionado = null;
        nombre.textContent = "Ningún archivo seleccionado";
        return;
      }
      archivoSeleccionado = file;
      Therion.ui.mostrarError("error", "");
      nombre.textContent = file ? file.name : "Ningún archivo seleccionado";
    });

    document.getElementById("btn-guardar").addEventListener("click", guardarEvaluacion);
    actualizarRequisitoEvidencia();
  }

  function actualizarRequisitoEvidencia() {
    var requiere = !!EXIGEN_EVIDENCIA[estadoSeleccionado];
    document.getElementById("evidencia-obligatoria").classList.toggle("hidden", !requiere);
    document.getElementById("evidencia-opcional").classList.toggle("hidden", requiere);
    var hint = document.getElementById("evidencia-hint");
    if (requiere) {
      hint.textContent = "Obligatoria para los estados Cumplido y Parcial.";
      hint.style.color = "var(--partial)";
    } else {
      hint.textContent = "Opcional para este estado.";
      hint.style.color = "var(--ink-subtle)";
    }
  }

  function guardarEvaluacion() {
    var requiere = !!EXIGEN_EVIDENCIA[estadoSeleccionado];
    if (requiere && !archivoSeleccionado) {
      Therion.ui.mostrarError("error", "Este estado requiere adjuntar evidencia en PDF antes de continuar.");
      return;
    }
    var btn = document.getElementById("btn-guardar");
    btn.disabled = true;
    btn.textContent = "Guardando…";
    var control = controles[controlIndex];

    Therion.store.api.registrarEvaluacion(diagnosticoId, control.control_id, estadoSeleccionado, archivoSeleccionado)
      .then(function () {
        if (controlIndex + 1 < controles.length) {
          controlIndex++;
          renderControl();
        } else {
          return Therion.store.api.cerrarDiagnostico(diagnosticoId).then(function () {
            window.location.href = "resumen.html";
          });
        }
      })
      .catch(function (err) {
        Therion.ui.mostrarError("error", err.message || "Error al guardar la evaluación");
        btn.disabled = false;
        btn.textContent = controlIndex + 1 < controles.length ? "Guardar y continuar" : "Guardar y cerrar diagnóstico";
      });
  }

  Therion.ui.protegerPagina({ permitidoSinDiagnostico: true })
    .then(function () { return asegurarDiagnostico(); })
    .then(function (id) {
      diagnosticoId = id;
      return Therion.store.api.reglasAplicabilidad();
    })
    .then(function (r) {
      reglas = r.sort(function (a, b) { return a.orden - b.orden; });
      renderGate();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
