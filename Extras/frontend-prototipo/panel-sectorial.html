<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel sectorial — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container-lg" id="app">
    <p class="loading">Cargando…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  var RUBROS = [{ id: "", nombre: "Todos" }].concat(Therion.data.RUBROS);
  var rubroActual = "";
  var cacheItems = null;

  function labelRubro(id) {
    var r = RUBROS.filter(function (x) { return x.id === id; })[0];
    return r ? r.nombre : id;
  }

  function render() {
    var app = document.getElementById("app");
    var botones = RUBROS.map(function (r) {
      var sel = r.id === rubroActual;
      return '<button type="button" class="option-chip" aria-checked="' + sel +
             '" data-rubro="' + r.id + '">' + Therion.ui.escapeHtml(r.nombre) + '</button>';
    }).join("");

    var cuerpo;
    if (cacheItems === null) {
      cuerpo = Therion.ui.skeletonList(4);
    } else if (cacheItems.length === 0) {
      cuerpo = Therion.ui.emptyState({
        title: "Aún no hay datos suficientes",
        description: "El panel solo muestra celdas con 5 o más organizaciones distintas. " +
                     "En cuanto se alcance ese umbral en algún rubro, aparecerán aquí.",
      });
    } else {
      cuerpo =
        '<div class="card-grid">' +
          cacheItems.map(function (item) {
            return (
              '<div class="card card--metric">' +
                '<p class="text-caption u-upper mb-2">' + Therion.ui.escapeHtml(labelRubro(item.rubro_id)) + '</p>' +
                '<p class="text-sm mb-3">' + Therion.ui.escapeHtml(item.dimension) + '</p>' +
                '<p class="metric-value">' + item.promedio + '%</p>' +
                '<p class="metric-label">' + item.n_organizaciones + ' organizaciones</p>' +
              '</div>'
            );
          }).join("") +
        '</div>';
    }

    app.innerHTML =
      Therion.ui.pageHeader({
        title: "Panel sectorial",
        subtitle: "Promedios agregados y anonimizados. Solo se muestran celdas con 5 o más organizaciones distintas.",
        actions: '<a class="btn btn--secondary" href="panel-metodologia.html">Metodología</a>',
      }) +
      '<div class="option-group mb-6" id="filtros" role="radiogroup" aria-label="Filtrar por rubro">' + botones + '</div>' +
      '<div id="resultados">' + cuerpo + '</div>';

    document.querySelectorAll("#filtros button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        rubroActual = btn.getAttribute("data-rubro");
        document.querySelectorAll("#filtros button").forEach(function (b) {
          b.setAttribute("aria-checked", b === btn ? "true" : "false");
        });
        cargar();
      });
    });
  }

  function cargar() {
    cacheItems = null;
    render();
    Therion.store.api.panelSectorial(rubroActual || undefined).then(function (items) {
      cacheItems = items;
      render();
    }).catch(function () {
      cacheItems = [];
      render();
    });
  }

  Therion.ui.protegerPagina({ permitidoSinDiagnostico: false })
    .then(function () { cargar(); })
    .catch(function () {});
})();
</script>
</body>
</html>
