<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autodiagnóstico — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container" style="text-align:center;" id="app">
    <p class="loading">Cargando…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
  Therion.ui.protegerPagina({ permitidoSinDiagnostico: true }).then(function (me) {
    var app = document.getElementById("app");
    var texto = me.tiene_diagnostico_cerrado
      ? "Puedes iniciar un nuevo diagnóstico para volver a evaluar el estado de tu organización."
      : "Responde 7 preguntas de puerta y evalúa los controles aplicables para desbloquear el resto de la plataforma (informe, formación y panel sectorial).";
    app.innerHTML =
      '<h1 class="font-editorial mb-4" style="font-size:1.8rem;">Autodiagnóstico de gobernanza de IA</h1>' +
      '<p class="text-muted mb-8">' + Therion.ui.escapeHtml(texto) + '</p>' +
      '<p id="error" class="error-text hidden mb-4"></p>' +
      '<button class="btn" id="btn-iniciar">Iniciar nuevo diagnóstico</button>';

    document.getElementById("btn-iniciar").addEventListener("click", function () {
      this.disabled = true;
      this.textContent = "Creando…";
      Therion.store.api.crearDiagnostico().then(function (diag) {
        window.localStorage.setItem("therion_diagnostico_id", diag.id);
        window.location.href = "cuestionario.html";
      }).catch(function (err) {
        Therion.ui.mostrarError("error", err.message || "No se pudo crear el diagnóstico");
        document.getElementById("btn-iniciar").disabled = false;
        document.getElementById("btn-iniciar").textContent = "Iniciar nuevo diagnóstico";
      });
    });
  }).catch(function () {});
</script>
</body>
</html>
