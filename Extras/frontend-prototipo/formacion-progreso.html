<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi progreso — ComplainceIA</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="page">
<div id="sidebar-mount"></div>
<div id="content-wrapper">
  <div id="demo-banner-mount"></div>
  <div class="container" id="app">
    <p class="loading">Cargando progreso…</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/logica.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
  var ESTADO_COLOR = { bloqueado: "var(--na)", en_curso: "var(--partial)", completado: "var(--verify)" };
  var ESTADO_LABEL = { bloqueado: "Bloqueado", en_curso: "En curso", completado: "Completado" };

  Therion.ui.protegerPagina({ permitidoSinDiagnostico: false })
    .then(function () { return Therion.store.api.mapaFormativo(); })
    .then(function (mapa) {
      var app = document.getElementById("app");
      var todos = [];
      Object.keys(mapa).forEach(function (d) { todos = todos.concat(mapa[d]); });
      var completados = todos.filter(function (m) { return m.estado === "completado"; }).length;
      var enCurso = todos.filter(function (m) { return m.estado === "en_curso"; }).length;
      var total = todos.length;
      var pct = total ? Math.round((completados / total) * 100) : 0;

      var secciones = Object.keys(mapa).map(function (dimension) {
        var modulos = mapa[dimension];
        var hechos = modulos.filter(function (m) { return m.estado === "completado"; }).length;
        var pctDim = modulos.length ? Math.round((hechos / modulos.length) * 100) : 0;

        var filas = modulos.map(function (m) {
          return (
            '<li class="list-row">' +
              '<span>' + Therion.ui.escapeHtml(m.nivel) + ' — ' + Therion.ui.escapeHtml(m.titulo) + '</span>' +
              Therion.ui.statusTag(ESTADO_LABEL[m.estado] || m.estado, ESTADO_COLOR[m.estado] || "var(--na)") +
            '</li>'
          );
        }).join("");

        return (
          '<section class="mb-6">' +
            '<div class="flex justify-between items-center mb-2 wrap gap-2">' +
              '<h2 class="text-h3">' + Therion.ui.escapeHtml(dimension) + '</h2>' +
              '<span class="text-xs text-faint">' + hechos + ' / ' + modulos.length + ' completados</span>' +
            '</div>' +
            '<div class="progress mb-3"><span style="width:' + pctDim + '%"></span></div>' +
            '<ul class="list-plain text-sm">' + filas + '</ul>' +
          '</section>'
        );
      }).join("");

      app.innerHTML =
        Therion.ui.pageHeader({
          title: "Mi progreso formativo",
          subtitle: "Avance general sobre los módulos habilitados para tu diagnóstico.",
          actions: '<a class="btn btn--secondary" href="formacion-mapa.html">Volver al mapa</a>',
        }) +

        '<div class="card mb-6">' +
          '<div class="flex justify-between items-center mb-2 wrap gap-2">' +
            '<span class="text-caption u-upper">Avance general</span>' +
            '<span class="font-editorial" style="font-size:1.4rem;font-weight:600;">' + pct + '%</span>' +
          '</div>' +
          '<div class="progress mb-3"><span style="width:' + pct + '%"></span></div>' +
          '<div class="flex gap-6 wrap text-sm text-muted">' +
            '<span><strong style="color:var(--verify)">' + completados + '</strong> completados</span>' +
            '<span><strong style="color:var(--partial)">' + enCurso + '</strong> en curso</span>' +
            '<span>' + total + ' módulos totales</span>' +
          '</div>' +
        '</div>' +
        secciones;
    })
    .catch(function () {});
</script>
</body>
</html>
